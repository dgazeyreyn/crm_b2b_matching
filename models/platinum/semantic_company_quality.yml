version: 2

semantic_models:
  - name: company_quality
    description: >
      Semantic model exposing derived data quality indicators related
      to geographic consistency of ZoomInfo company attributes.

    model: ref('mart_company_quality')

    entities:
      - name: company
        type: primary
        expr: zi_company_id

    dimensions:
      - name: zi_company_city
        type: categorical

      - name: zi_company_region
        type: categorical

    measures:
      - name: total_companies
        description: Total number of company records evaluated
        agg: count

      - name: inconsistent_city_region_count
        description: Count of companies with mismatched city-region pairs
        expr: city_region_inconsistent
        agg: sum
