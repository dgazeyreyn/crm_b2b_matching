version: 2

semantic_models:
  - name: match_quality
    description: >
      Semantic model representing algorithm-generated matches between
      CRM accounts and ZoomInfo companies. Used to analyze confidence
      levels, algorithm versions, and matching behavior over time.

    model: ref('fact_match')

    entities:
      - name: match
        type: primary
        expr: |
          concat(
            crm_account_id,
            '-',
            zi_company_id,
            '-',
            cast(match_date as string)
          )

      - name: crm_account
        type: foreign
        expr: crm_account_id

      - name: company
        type: foreign
        expr: zi_company_id

    dimensions:
      - name: match_date
        type: time
        expr: match_date
        type_params:
          time_granularity: day

      - name: algorithm_version
        type: categorical

    measures:
      - name: total_matches
        description: Total number of algorithm-generated matches
        agg: count

      - name: avg_match_confidence
        description: Average confidence score assigned by the algorithm
        expr: match_confidence_score
        agg: average