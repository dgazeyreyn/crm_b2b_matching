version: 2
models:
- name: fact_customer_health
  description: Fact table containing tenant-level business metrics including ACV and
    NPS.
  columns:
  - name: tenant_id
    description: Foreign key referencing the tenant dimension.
    tests:
    - not_null
    - relationships:
        to: ref('dim_tenant')
        field: tenant_id
  - name: annual_contract_value
    description: Annual contract revenue associated with the tenant.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: data_quality_nps
    description: "Net Promoter Score measuring satisfaction with data quality (0\u2013\
      10)."
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 10
