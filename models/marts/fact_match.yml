version: 2

models:
  - name: fact_match
    description: "Fact table representing account-company match results."

    columns:
      - name: crm_account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_crm_account')
              field: crm_account_id

      - name: zi_company_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_company')
              field: zi_company_id
