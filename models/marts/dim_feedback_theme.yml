version: 2

models:
  - name: dim_feedback_theme
    description: "Dimension table of standardized support feedback themes representing categories of customer concerns or issues."
    columns:
      - name: feedback_theme_key
        description: "Primary key for feedback theme dimension."
        tests:
          - not_null
          - unique

      - name: feedback_theme
        description: "Human-readable label describing the type of support feedback."
        tests:
          - accepted_values:
              values:
                - data_completeness
                - match_accuracy
                - no_match_found
                - outdated_company_info
                - poor_data_quality
                - wrong_company_matched
