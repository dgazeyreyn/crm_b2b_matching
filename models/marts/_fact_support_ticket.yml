version: 2
models:
- name: fact_support_ticket
  description: Fact table containing aggregated customer support ticket themes by
    tenant, theme, and date.
  columns:
  - name: ticket_id
    description: Surrogate primary key representing a tenant-theme-date grouping.
    tests:
    - not_null
    - unique
  - name: tenant_id
    description: Foreign key referencing tenant submitting the ticket.
    tests:
    - not_null
    - relationships:
        to: ref('dim_tenant')
        field: tenant_id
  - name: feedback_theme_key
    description: Foreign key referencing the feedback theme dimension.
    tests:
    - not_null
    - relationships:
        to: ref('dim_feedback_theme')
        field: feedback_theme_key
  - name: date_key
    description: Foreign key referencing the date dimension.
    tests:
    - not_null
    - relationships:
        to: ref('dim_date')
        field: date_key
  - name: frequency
    description: Number of records affected for the theme on the given date.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: avg_severity
    description: "Average severity of tickets (0\u201310)."
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 10
  - name: resolution_days
    description: Days required to resolve the ticket(s).
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  - name: updated_at
    description: Timestamp indicating the last update of the record.
