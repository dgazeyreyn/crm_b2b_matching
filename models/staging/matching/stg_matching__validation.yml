version: 2

models:
  - name: stg_matching__validation
    description: "Staging model containing manual validation work performed by ZoomInfo’s internal research team to assess match accuracy."

    columns:
      - name: crm_account_id
        description: "CRM account evaluated during validation."
        tests:
          - not_null
          - unique

      - name: zi_company_id
        description: "ZoomInfo company evaluated during validation."
        tests:
          - not_null
          - unique

      - name: match_confidence_score
        description: "Confidence score from the algorithm for the associated match."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: manual_validation_result
        description: "Outcome of manual validation."
        tests:
          - accepted_values:
              arguments:
                values: ["CORRECT", "INCORRECT"]

      - name: validation_notes
        description: "Optional notes provided by the validator."

      - name: validator_name
        description: "Name or identifier of the validating researcher."

      - name: validation_date
        description: "Date of manual validation."
        tests:
          - not_null