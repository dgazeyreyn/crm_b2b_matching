models:
  - name: stg_customer_support__ticket_dates
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

  - name: stg_customer_support__tickets
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

  - name: stg_customer_support__feedback_themes
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
      - name: feedback_theme
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - data_completeness
                  - match_accuracy
                  - no_match_found
                  - outdated_company_info
                  - poor_data_quality
                  - wrong_company_matched

  - name: stg_customer_support__frequency
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

  - name: stg_customer_support__resolution_days
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

  - name: stg_customer_support__severity
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null