models:
  - name: stg_support__support_feedback_themes
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null
      - name: feedback_theme
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - data_completeness
                  - match_accuracy
                  - no_match_found
                  - outdated_company_info
                  - poor_data_quality
                  - wrong_company_matched