models:
  - name: stg_crm_tenants__annual_contract_value
    columns:
      - name: tenant_id
        data_tests:
          - unique
          - not_null

  - name: stg_crm_tenants__data_quality_nps
    columns:
      - name: tenant_id
        data_tests:
          - unique
          - not_null

  - name: stg_crm_tenants__industries
    columns:
      - name: tenant_id
        data_tests:
          - unique
          - not_null

  - name: stg_crm_tenants__segments
    columns:
      - name: tenant_id
        data_tests:
          - unique
          - not_null
      - name: customer_segment
        data_tests:
          - accepted_values:
              values:
               - ENT
               - MM
               - SMB

  - name: stg_crm_tenants__tenants
    columns:
      - name: tenant_id
        data_tests:
          - unique
          - not_null