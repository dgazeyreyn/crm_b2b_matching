name: python-dbt-check

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dbt
        run: |
          pip install dbt-core==1.10.3 dbt-bigquery==1.10.3

      - name: Verify dbt
        run: dbt --version
