# 1️⃣ Set up Python
- name: Set up Python 3.10
  uses: actions/setup-python@v4
  with:
    python-version: 3.10

# 2️⃣ Install dbt and dbt-bigquery
- name: Install dbt
  run: |
    python -m pip install --upgrade pip
    pip install "dbt-bigquery==1.11.0"

# 3️⃣ Create ~/.dbt and profiles.yml
- name: Set up dbt profiles.yml
  run: |
    mkdir -p $HOME/.dbt
    cat <<EOF > $HOME/.dbt/profiles.yml
default:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "zi-case-study"
      dataset: "zi-case-study"
      location: US
      keyfile: "$HOME/.dbt/bigquery-sa.json"
      threads: 4
      timeout_seconds: 300
      priority: interactive
EOF

# 4️⃣ Run dbt docs generate
- name: Generate dbt docs
  run: dbt docs generate
