name: Build and deploy dbt docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt and adapter packages
        env:
          DBT_ADAPTER_PACKAGES: ${{ secrets.DBT_ADAPTER_PACKAGES }}
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core
          if [ -n "$DBT_ADAPTER_PACKAGES" ]; then pip install $DBT_ADAPTER_PACKAGES; fi

      - name: Write GCP service account key
        if: ${{ secrets.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p /tmp
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp_keyfile.json
          chmod 600 /tmp/gcp_keyfile.json

      - name: Write DBT profiles from secret
        if: ${{ secrets.DBT_PROFILES_YML != '' }}
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          mkdir -p ~/.dbt
          printf '%s' "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml
          chmod 600 ~/.dbt/profiles.yml
          echo "Wrote profiles.yml to ~/.dbt/profiles.yml"

      - name: Debug: show dbt version
        run: dbt --version || true

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Prepare site directory
        run: |
          mkdir -p site
          cp -r target/* site/ || true

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
