name: dbt Docs CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
            python-version: "3.10"  # quoting can help avoid misinterpretation

      # 3️⃣ Install dbt-bigquery
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.11.0

      # 4️⃣ Set up GCP keyfile
      - name: Set up GCP keyfile
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.GCP_SA_KEY }}" > ~/.dbt/bigquery-sa.json

      # 5️⃣ Set up DBT profiles
      - name: Set up DBT profiles
        run: |
          mkdir -p ~/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      # 6️⃣ Run dbt docs generate
      - name: Generate dbt docs
        run: dbt docs generate
