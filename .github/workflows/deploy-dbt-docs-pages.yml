name: Generate dbt Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dbt
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.10.3

      # 4️⃣ Write BigQuery service account key
      - name: Set up GCP keyfile
        run: |
          mkdir -p $GITHUB_WORKSPACE/.dbt
          echo "${{ secrets.GCP_SA_KEY }}" > $GITHUB_WORKSPACE/.dbt/bigquery-sa.json
          echo "DBT_BIGQUERY_KEYFILE=$GITHUB_WORKSPACE/.dbt/bigquery-sa.json" >> $GITHUB_ENV

      # 5️⃣ Write profiles.yml
      - name: Set up dbt profiles
        run: |
          mkdir -p $HOME/.dbt
          cat <<EOF > $HOME/.dbt/profiles.yml
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: zi-case-study
                dataset: dbt_dreynolds
                location: US
                keyfile: $HOME/.dbt/bigquery-sa.json
                threads: 4
                timeout_seconds: 300
          EOF

      # 6️⃣ Generate dbt docs

      # Install dbt package dependencies
      - name: Install dbt deps
        run: dbt deps

      - name: Generate dbt docs
        run: dbt docs generate --debug --no-partial-parse

