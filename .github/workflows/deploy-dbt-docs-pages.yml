name: Publish dbt Docs

on:
  push:
    branches:
      - main  # Change if your primary branch is different

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install dbt BigQuery (includes dbt Core 1.7+)
      - name: Install dbt BigQuery
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "dbt-bigquery>=1.7,<2.0"

      # 4️⃣ Verify installed dbt version
      - name: Verify dbt version
        run: dbt --version

      # 5️⃣ Install packages declared in packages.yml
      - name: Install dbt packages
        run: dbt deps

      # 6️⃣ Generate dbt docs
      - name: Generate dbt docs
        env:
          DBT_PROFILES_DIR: .
        run: dbt docs generate

      # 7️⃣ Deploy docs to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          user_name: github-actions
          user_email: github-actions@github.com
