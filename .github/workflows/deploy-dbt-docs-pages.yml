name: Generate dbt Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 3️⃣ Install dbt-bigquery
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery==1.10.3

      # 4️⃣ Create .dbt folder
      - name: Create .dbt folder
        run: mkdir -p $HOME/.dbt

      # 5️⃣ Write BigQuery service account key
      - name: Set up GCP keyfile
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > $HOME/.dbt/bigquery-sa.json
          echo "DBT_BIGQUERY_KEYFILE=$HOME/.dbt/bigquery-sa.json" >> $GITHUB_ENV

      # 6️⃣ Write dbt profiles.yml
      - name: Set up dbt profiles
        run: |
          cat <<'EOF' > $HOME/.dbt/profiles.yml
default:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: zi-case-study
      dataset: dbt_dreynolds
      location: US
      keyfile: "{{ env_var('DBT_BIGQUERY_KEYFILE') }}"
      threads: 4
      timeout_seconds: 300
EOF

      # 7️⃣ Install dbt dependencies
      - name: Install dbt deps
        run: dbt deps

      # 8️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate --no-partial-parse --debug

      # 9️⃣ Deploy dbt docs to GitHub Pages
      - name: Deploy dbt docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target
          publish_branch: gh-pages
