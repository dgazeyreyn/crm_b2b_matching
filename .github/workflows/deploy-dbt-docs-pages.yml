name: dbt-docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 3️⃣ Upgrade pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # 4️⃣ Install dbt-bigquery (stable)
      - name: Install dbt-bigquery
        run: pip install dbt-bigquery==1.10.3

        # 💡 Optional: pre-release 1.11.0rc2 if needed
        # run: pip install --pre dbt-bigquery==1.11.0rc2

      # 5️⃣ Confirm dbt version
      - name: Check dbt version
        run: dbt --version

      # 6️⃣ Run dbt docs generate
      - name: Generate dbt docs
        run: dbt docs generate

