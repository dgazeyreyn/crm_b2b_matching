name: dbt Docs Generate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dbt_docs:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: $HOME/.dbt

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 3️⃣ Install dbt
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-bigquery==1.11.0"

      # 4️⃣ Set up GCP service account key
      - name: Set up GCP keyfile
        run: |
          mkdir -p $HOME/.dbt
          echo "${{ secrets.GCP_SA_KEY }}" > $HOME/.dbt/bigquery-sa.json
          chmod 600 $HOME/.dbt/bigquery-sa.json

      # 5️⃣ Set up DBT profiles
      - name: Set up dbt profiles
        run: |
          mkdir -p $HOME/.dbt
          echo "${{ secrets.DBT_PROFILES_YML }}" > $HOME/.dbt/profiles.yml

      # 6️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate
