name: Deploy dbt Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-dbt-docs:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install dbt-bigquery
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "dbt-bigquery>=1.7,<2.0"

      # 4️⃣ Set up GCP keyfile in CI
      - name: Set up GCP keyfile
        run: |
          mkdir -p $HOME/.dbt
          cat <<EOF > $HOME/.dbt/bigquery-sa.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

      # 5️⃣ Set up dbt profiles
      - name: Set up dbt profiles
        run: |
          echo "${{ secrets.DBT_PROFILES_YML }}" > ~/.dbt/profiles.yml

      # 6️⃣ Install dbt package dependencies
      - name: Install dbt packages
        run: dbt deps

      # 7️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate

      # 8️⃣ Publish docs to GitHub Pages
      - name: Publish dbt docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          user_name: github-actions
          user_email: github-actions@github.com
          force_orphan: true
          enable_jekyll: false
