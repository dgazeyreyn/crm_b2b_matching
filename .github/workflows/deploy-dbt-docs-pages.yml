name: Deploy dbt docs

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 3️⃣ Install dbt and dbt-bigquery
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-bigquery==1.11.0"

      # 4️⃣ Create ~/.dbt and profiles.yml
      - name: Set up dbt profiles.yml
        run: |
          mkdir -p $HOME/.dbt
          cat <<EOF > $HOME/.dbt/profiles.yml
default:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "zi-case-study"
      dataset: "zi-case-study"
      location: US
      keyfile: "$HOME/.dbt/bigquery-sa.json"
      threads: 4
      timeout_seconds: 300
      priority: interactive
EOF

      # 5️⃣ Generate dbt docs
      - name: Generate dbt docs
        run: dbt docs generate

