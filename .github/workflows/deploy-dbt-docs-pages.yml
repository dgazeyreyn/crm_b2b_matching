name: Build and deploy dbt docs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt and adapter packages
        env:
          DBT_ADAPTER_PACKAGES: ${{ secrets.DBT_ADAPTER_PACKAGES }}
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core
          if [ -n "$DBT_ADAPTER_PACKAGES" ]; then pip install $DBT_ADAPTER_PACKAGES; fi

      - name: Write GCP service account key (if provided)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            mkdir -p /tmp
            printf '%s' "$GCP_SA_KEY" > /tmp/gcp_keyfile.json
            chmod 600 /tmp/gcp_keyfile.json
            echo "Wrote /tmp/gcp_keyfile.json"
          else
            echo "GCP_SA_KEY secret not set — skipping keyfile write"
          fi

      - name: Write DBT profiles from secret (if provided)
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          if [ -n "$DBT_PROFILES_YML" ]; then
            mkdir -p ~/.dbt
            printf '%s' "$DBT_PROFILES_YML" > ~/.dbt/profiles.yml
            chmod 600 ~/.dbt/profiles.yml
            echo "Wrote ~/.dbt/profiles.yml"
          else
            echo "DBT_PROFILES_YML secret not set — skipping profiles write"
          fi

      - name: Install dbt BigQuery
        run: |
          pip install "dbt-bigquery>=1.7,<2.0"

      - name: Install dbt package dependencies
        run: |
          # Ensure packages declared in packages.yml are installed
          dbt deps
          ls -la dbt_packages || true

      - name: Debug macros directory
        run: |
          echo "=== macros directory ==="
          find macros -type f || echo "no macros found"
      
          echo "=== materializations anywhere ==="
          find . -path "*materializations*" -type f

      - name: Validate dbt project (parse)
        run: |
          dbt parse

      - name: Debug show dbt version
        run: |
          dbt --version || true

      - name: Generate dbt docs
        run: |
          dbt docs generate

      - name: Prepare site directory
        run: |
          mkdir -p site
          cp -r target/* site/ || true

      - name: Deploy to gh-pages using actions-gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
