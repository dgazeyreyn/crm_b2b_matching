name: Build and Deploy dbt Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dbt (pin to a stable version known to exist on pip)
      # If you specifically want 1.10.15 later, we can try that after this is working.
      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.10.15 dbt-bigquery==1.10.3

      - name: Write BigQuery service account key
        run: |
          mkdir -p /home/runner/.gcp
          echo '${{ secrets.GCP_SA_KEY }}' > /home/runner/.gcp/gcp-key.json

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          python - <<'PY'
          import pathlib, textwrap

          profiles = textwrap.dedent("""\
          default:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "zi-case-study"
                dataset: "dbt_dreynolds"
                location: "US"
                keyfile: "/home/runner/.gcp/gcp-key.json"
                threads: 4
                timeout_seconds: 300
          """)

          path = pathlib.Path.home() / ".dbt" / "profiles.yml"
          path.write_text(profiles)
          print("Wrote", path)
          PY

      - name: dbt deps
        run: dbt deps --profiles-dir ~/.dbt

      - name: Check dbt version
        run: |
          dbt --version

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir ~/.dbt

      - name: Build published site
        run: |
          mkdir site

          # Copy landing page
          cp index.html site/

          # Copy dbt docs under a subdirectory
          mkdir site/dbt-docs
          cp -R target/* site/dbt-docs/

          # Prevent GitHub Pages from processing dbt assets
          touch site/.nojekyll

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages